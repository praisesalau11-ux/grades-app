<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Log in to GradeFlow"
    >

    <title>Log in — GradeFlow</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <button
                type="button"
                id="backButton"
                class="back-button"
            >
                ← Back
            </button>


            <div class="brand">
                GradeFlow
            </div>


            <div class="heading">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in to continue to GradeFlow.
                </p>

            </div>


            <button
                type="button"
                id="googleLogin"
                class="google-login"
            >

                <span class="google-icon">
                    G
                </span>

                <span class="google-content">

                    <strong>
                        Continue with Google
                    </strong>

                    <small>
                        Use your Google account
                    </small>

                </span>

                <span class="google-arrow">
                    →
                </span>

            </button>


            <div class="divider">

                <span></span>

                <small>
                    OR
                </small>

                <span></span>

            </div>


            <form
                id="loginForm"
                novalidate
            >

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                    >

                    <small
                        id="emailError"
                        class="field-error"
                    ></small>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrap">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        id="passwordError"
                        class="field-error"
                    ></small>

                </div>


                <div class="forgot-row">

                    <button
                        type="button"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot password?
                    </button>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span>
                        Log in
                    </span>

                    <span>
                        →
                    </span>

                </button>


                <div
                    id="loginMessage"
                    class="login-message"
                    role="status"
                ></div>

            </form>


            <p class="signup-link">

                Don't have an account?

                <a href="choice.html">
                    Create an account
                </a>

            </p>

        </section>

    </main>


    <script
        type="module"
        src="js/login.js"
    ></script>

</body>

</html>
