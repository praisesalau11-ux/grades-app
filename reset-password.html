<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your GradeFlow password"
    >

    <title>Reset Password — GradeFlow</title>

    <link
        rel="stylesheet"
        href="css/reset-password.css"
    >

</head>


<body>

    <main class="reset-page">

        <section class="reset-card">

            <div class="brand">
                GradeFlow
            </div>


            <div
                id="resetState"
                class="reset-state"
            >

                <h1>
                    Create a new password
                </h1>

                <p>
                    Enter a new password for your
                    GradeFlow account.
                </p>


                <form
                    id="resetForm"
                    novalidate
                >

                    <div class="field">

                        <label for="newPassword">
                            New password
                        </label>

                        <div class="password-wrap">

                            <input
                                id="newPassword"
                                name="newPassword"
                                type="password"
                                autocomplete="new-password"
                                minlength="6"
                                placeholder="Enter your new password"
                            >

                            <button
                                type="button"
                                id="passwordToggle"
                                class="password-toggle"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            id="passwordError"
                            class="field-error"
                        ></small>

                    </div>


                    <div class="field">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <div class="password-wrap">

                            <input
                                id="confirmPassword"
                                name="confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                minlength="6"
                                placeholder="Confirm your new password"
                            >

                            <button
                                type="button"
                                id="confirmToggle"
                                class="password-toggle"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            id="confirmError"
                            class="field-error"
                        ></small>

                    </div>


                    <button
                        type="submit"
                        id="resetButton"
                        class="reset-button"
                    >
                        <span>
                            Reset password
                        </span>

                        <span>
                            →
                        </span>
                    </button>


                    <div
                        id="resetMessage"
                        class="reset-message"
                        role="status"
                    ></div>

                </form>

            </div>


            <div
                id="successState"
                class="reset-state hidden"
            >

                <h1>
                    Password updated
                </h1>

                <p>
                    Your GradeFlow password has been
                    changed successfully.
                </p>

                <a
                    href="login.html"
                    class="login-button"
                >
                    Return to login
                </a>

            </div>


            <div
                id="errorState"
                class="reset-state hidden"
            >

                <h1>
                    Reset link unavailable
                </h1>

                <p id="errorText">
                    This password reset link is invalid
                    or has expired.
                </p>

                <a
                    href="login.html"
                    class="login-button"
                >
                    Return to login
                </a>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/reset-password.js"
    ></script>

</body>

</html>
