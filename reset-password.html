<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#11110f"
>

<title>Reset Password — GradeFlow</title>

<link
    rel="stylesheet"
    href="css/reset-password.css"
>

</head><body><main class="reset-page">

    <section class="reset-card">

        <!-- BRAND -->
        <div class="brand">

            <div class="brand-mark">
                G
            </div>

            <div class="brand-name">
                GradeFlow
            </div>

        </div>


        <!-- RESET CONTENT -->
        <div class="reset-content">

            <div class="icon-container">
                <span>↻</span>
            </div>

            <h1>
                Reset your password
            </h1>

            <p class="subtitle">
                Create a new password for your GradeFlow account.
            </p>


            <!-- RESET FORM -->
            <form
                id="resetPasswordForm"
                novalidate
            >

                <!-- NEW PASSWORD -->
                <div class="field">

                    <label for="newPassword">
                        New password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="newPasswordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <div
                        id="newPasswordError"
                        class="field-error"
                    ></div>

                </div>


                <!-- PASSWORD STRENGTH -->
                <div class="strength-container">

                    <div class="strength-bar">

                        <div
                            id="strengthBar"
                            class="strength-fill"
                        ></div>

                    </div>

                    <p
                        id="strengthText"
                        class="strength-text"
                    >
                        Enter a password
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="field">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="confirmPasswordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <div
                        id="confirmPasswordError"
                        class="field-error"
                    ></div>

                </div>


                <!-- MESSAGE -->
                <div
                    id="resetMessage"
                    class="reset-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    id="resetButton"
                    class="reset-button"
                >

                    <span>
                        Reset password
                    </span>

                    <span aria-hidden="true">
                        →
                    </span>

                </button>

            </form>


            <!-- BACK TO LOGIN -->
            <a
                href="login.html"
                id="loginLink"
                class="login-link"
            >
                ← Back to login
            </a>

        </div>

    </section>

</main>


<script
    type="module"
    src="js/reset-password.js"
></script>

</body></html>
